<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="etlStackTitle">
  <title id="etlStackTitle">The etl explicit stack: @etl.defn → Graph → LoweredProgram → CompiledArtifact → Executable → Tensor, joined by etl.trace, etl.lower, etl.compile, etl.load and etl.run; graph-to-graph transforms (vectorize, vmap, grad, jvp, vjp) leave and re-enter Graph; below the compiler boundary sit the numpy interpreter (the default backend) and the external ML compilers IREE, XLA and TVM.</title>

  <defs>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0b429"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- page card -->
  <rect x="0.75" y="0.75" width="1198.5" height="558.5" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- header -->
  <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.4" fill="#8b949e">THE EXPLICIT STACK</text>
  <text x="1176" y="46" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">one public function per stage</text>

  <!-- transforms callout above Graph: graph -> graph -->
  <rect x="196" y="62" width="384" height="32" rx="10" fill="#161b22" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="212" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e6edf3">transforms: vectorize &#183; vmap &#183; grad &#183; jvp &#183; vjp</text>
  <text x="592" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">graph &#8594; graph</text>
  <path d="M 258 134 L 258 106 L 356 106 L 356 133" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrowCyan)"/>

  <!-- ============ main pipeline row (6 stage cards, 172x112, 24px gaps) ============ -->

  <!-- 01 @etl.defn -->
  <rect x="24" y="136" width="172" height="112" rx="12" fill="#161b22" stroke="#7c5cff" stroke-width="1.5"/>
  <rect x="40" y="156" width="20" height="3" rx="1.5" fill="#7c5cff"/>
  <text x="180" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e" fill-opacity="0.7">01</text>
  <text x="40" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e6edf3">@etl.defn</text>
  <text x="40" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">Python graph</text>
  <text x="40" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">function</text>

  <!-- 02 Graph -->
  <rect x="220" y="136" width="172" height="112" rx="12" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="236" y="156" width="20" height="3" rx="1.5" fill="#22d3ee"/>
  <text x="376" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e" fill-opacity="0.7">02</text>
  <text x="236" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e6edf3">Graph</text>
  <text x="236" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">EvoXIR &#183;</text>
  <text x="236" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">region-based SSA</text>

  <!-- 03 LoweredProgram -->
  <rect x="416" y="136" width="172" height="112" rx="12" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="432" y="156" width="20" height="3" rx="1.5" fill="#22d3ee"/>
  <text x="572" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e" fill-opacity="0.7">03</text>
  <text x="432" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e6edf3">LoweredProgram</text>
  <text x="432" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">StableHLO</text>
  <text x="432" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">MLIR</text>

  <!-- 04 CompiledArtifact -->
  <rect x="612" y="136" width="172" height="112" rx="12" fill="#161b22" stroke="#f0b429" stroke-width="1.5"/>
  <rect x="628" y="156" width="20" height="3" rx="1.5" fill="#f0b429"/>
  <text x="768" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e" fill-opacity="0.7">04</text>
  <text x="628" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e6edf3">CompiledArtifact</text>
  <text x="628" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">compiler output</text>

  <!-- 05 Executable -->
  <rect x="808" y="136" width="172" height="112" rx="12" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
  <rect x="824" y="156" width="20" height="3" rx="1.5" fill="#34d399"/>
  <text x="964" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e" fill-opacity="0.7">05</text>
  <text x="824" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e6edf3">Executable</text>
  <text x="824" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">loaded &#183;</text>
  <text x="824" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">device-resident</text>

  <!-- 06 Tensor -->
  <rect x="1004" y="136" width="172" height="112" rx="12" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
  <rect x="1020" y="156" width="20" height="3" rx="1.5" fill="#34d399"/>
  <text x="1160" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e" fill-opacity="0.7">06</text>
  <text x="1020" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e6edf3">Tensor</text>
  <text x="1020" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">storage &#183;</text>
  <text x="1020" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e">real device</text>

  <!-- stage verbs above the gaps -->
  <text x="208" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">trace</text>
  <text x="404" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">lower</text>
  <text x="600" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">compile</text>
  <text x="796" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">load</text>
  <text x="992" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">run</text>

  <!-- pipeline arrows (accented by their target stage) -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M 201 192 L 212 192" stroke="#22d3ee" marker-end="url(#arrowCyan)"/>
    <path d="M 397 192 L 408 192" stroke="#22d3ee" marker-end="url(#arrowCyan)"/>
    <path d="M 593 192 L 604 192" stroke="#f0b429" marker-end="url(#arrowAmber)"/>
    <path d="M 789 192 L 800 192" stroke="#34d399" marker-end="url(#arrowGreen)"/>
    <path d="M 985 192 L 996 192" stroke="#34d399" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- compiler boundary -->
  <text x="24" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#8b949e">COMPILER BOUNDARY</text>
  <path d="M 24 318 L 1176 318" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- feeder 1: numpy interpreter (default backend) -->
  <rect x="90" y="344" width="470" height="122" rx="12" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
  <rect x="108" y="364" width="20" height="3" rx="1.5" fill="#34d399"/>
  <text x="108" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">numpy interpreter</text>
  <text x="108" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e">default backend &#183; no compiler, no codegen</text>
  <rect x="108" y="430" width="148" height="22" rx="11" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
  <text x="124" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#e6edf3">CPU &#183; host tensors</text>

  <!-- feeder 2: external ML compilers -->
  <rect x="640" y="344" width="470" height="122" rx="12" fill="#161b22" stroke="#f0b429" stroke-width="1.5"/>
  <rect x="658" y="364" width="20" height="3" rx="1.5" fill="#f0b429"/>
  <text x="658" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">external ML compilers</text>
  <text x="658" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e">IREE &#183; XLA (PJRT) &#183; TVM</text>
  <rect x="658" y="430" width="240" height="22" rx="11" fill="#0d1117" stroke="#f0b429" stroke-width="1.5"/>
  <text x="674" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#e6edf3">StableHLO &#8594; native GPU/CPU code</text>

  <!-- feeder arrows going UP into the compile step (the gap between stage 03 LoweredProgram and stage 04 CompiledArtifact) -->
  <path d="M 325 344 L 325 302 L 594 302 L 594 256" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
  <path d="M 875 344 L 875 292 L 606 292 L 606 256" fill="none" stroke="#f0b429" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>

  <!-- footer -->
  <path d="M 24 488 L 1176 488" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="512" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#8b949e">simple &#183; minimal &#183; explicit &#183; compiler-neutral</text>
  <text x="600" y="534" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" fill-opacity="0.72">no hidden tracing &#183; no hidden compile &#183; no hidden copy &#183; no invented communication</text>
</svg>
