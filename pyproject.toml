[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl"
version = "0.1.0"
description = "EvoX Tensor Library — a minimal, explicit, compiler-neutral tensor graph runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
interop = ["torch>=2.0"]  # DLPack interop tests only
dev = ["pytest>=7"]
# Compiler adapters — pluggable, optional. etl runs without any of these
# (the numpy interpreter backend is the default; StableHLO MLIR text is
# always exportable). Install an extra to enable the matching backend:
#   pip install etl[iree] / etl[tvm] / etl[compilers]
# The xla adapter has NO pip extra: it drives a USER-PROVIDED PJRT C API
# plugin (.so exporting GetPjRtApi) via ctypes — configure it with the
# ETL_PJRT_PLUGIN environment variable or the backend's plugin_path compile
# option. Nothing pip-installable provides the plugin; build one from
# OpenXLA, e.g. `bazel build //xla/pjrt/c:pjrt_c_api_cpu_plugin`.
# NOTE: IREE renamed its PyPI distributions — `iree-compiler`/`iree-runtime`
# are deprecated and STALE (last release 20241104.1068, Nov 2024); the
# current names are `iree-base-compiler`/`iree-base-runtime` (Python
# namespaces unchanged: iree.compiler / iree.runtime). 2.9.0 is the first
# release under the new names. Pin 3.11.x (>=3.11.0,<3.12): iree 3.11.0 was
# EMPIRICALLY validated on this repo's SO-algorithm CUDA path (fresh-process
# crash repro 3/3 clean at ~1000x50/~10000x100 device-resident same-device
# runs — the 3.9.0 class of upstream init-state finalization segfaults is
# GONE — plus a 6-case evox SO harness smoke run in ONE process with 0
# crashes: 5/6 cases device-resident at 0.6-3.4 ms/step with parity ok, the
# 6th (CMAES/Sphere/10000x100) completed but at 5628 ms/step with parity
# rel 0.185 (ok=False) — a slow-path anomaly flagged for follow-up, not a
# crash; see bench_logs/probe_iree_so_cuda.py and
# etl/backends/adapters/CONTEXT.md Known Issue #10).
# WARNING (unchanged): iree 3.10.0/3.11.0 still ship an
# upstream COMPILER bug (unbounded Stream AffinityAnalysis DFX recursion →
# iree-compile SIGSEGV on while-loop-heavy programs: stablehlo.while with
# >=3 loop-carried values + select in the body — the MO/NSGA2-class); the
# MO-on-iree path is upstream-blocked and OUT OF SCOPE (xla remains the
# recommended compiled backend for MO per the evox benchmark notes; a user
# needing iree for MO-only compile work may pin 3.9.0 explicitly — artifacts
# are version-specific and compiler/runtime must match, so version selection
# is a user decision; etl's validated/default path is 3.11.x). Compiler and
# runtime versions must MATCH (cross-version artifacts are rejected at load)
# — see Known Issue #10 in etl/backends/adapters/CONTEXT.md.
iree = ["iree-base-compiler>=3.11.0,<3.12", "iree-base-runtime>=3.11.0,<3.12"]
# tvm needs apache-tvm (StableHLO frontend + Relax VM) and jaxlib — jaxlib
# ONLY for its bundled LLVM MLIR python bindings (the vendored
# `jaxlib.mlir` namespace used by apache-tvm's translator). The `jax`
# package is never imported anywhere.
tvm = ["apache-tvm>=0.26", "jaxlib>=0.10,<0.11"]
compilers = [
    "iree-base-compiler>=3.11.0,<3.12",
    "iree-base-runtime>=3.11.0,<3.12",
    "apache-tvm>=0.26",
    "jaxlib>=0.10,<0.11",
]
# Only needed when running the etl.bench conformance/benchmark harness, which
# compares against PyTorch. The etl library itself never imports torch, and
# `import etl` must work without it.
bench = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# NOTE: do NOT include "dist" in norecursedirs — `tests/dist/` is a test
# package (pytest's default list would silently skip it).
norecursedirs = [".git", ".genesis", "__pycache__", "*.egg-info", "build", "node_modules", "venv"]
